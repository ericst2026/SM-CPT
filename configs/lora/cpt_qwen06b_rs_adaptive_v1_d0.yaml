# Per-layer / per-module LoRA rank plan for CPT of Qwen3-0.6B-Base (28 layers, 0-27).
#   python -m cpt_trainer.lora_plan configs/lora/cpt_qwen06b_rs_adaptive_v1.yaml       # print the rank table + params
#   python -m cpt_trainer.train --lora-config configs/lora/cpt_qwen06b_rs_adaptive_v1.yaml ...
#
# Target run: ~1 B domain tokens + 0.5-1 B replay tokens, rsLoRA, ranks 32-256.
# Derived from the weight analysis of runs/cpt_qwen06b_r64_300mb/epoch1 (r=64, 86 M tokens) and of the
# Qwen3-0.6B-Base -> Qwen3-0.6B (chat) delta:
#   runs/cpt_qwen06b_r64_300mb/epoch1_adapter_weight_diff.html, docs/qwen3_0.6b_base_vs_chat_weights.html
#
# Format
#   method      lora | rslora | dora | pissa | olora | loraplus | qlora | qdora  (ai_qa_train.common.LORA_METHODS)
#   alpha       lora_alpha; scale = alpha/sqrt(r) for rslora, alpha/r otherwise
#   default_r   rank of any (module, layer) not listed under `ranks`
#   rank_bounds [min, max]; the plan is rejected if a rank falls outside
#   targets     modules that get an adapter
#   ranks       module -> list of {layers, r}; layers = "all" | "a-b" | "a-b,c,d-e" | int. A layer may
#               appear only once per module.
#   alpha_overrides (optional) same structure as `ranks`, with `alpha` instead of `r`. Not needed with
#               rslora, whose alpha/sqrt(r) already keeps the update size stable across ranks.
#   CLI --method/--r/--alpha/--dropout/--targets are ignored for keys present here.

name: rs_adaptive_v1_d0
method: rslora
alpha: 16          # rslora: scale 2.0 at r=64 (= the r64/alpha128 run), 1.41 at r=128, 1.0 at r=256
dropout: 0.0        # rs_adaptive_v1 with dropout 0.0, to match cpt_qwen06b_rs128_long (rank plan is the only difference)
default_r: 64
rank_bounds: [32, 256]
targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

ranks:
  # --- self-attention: moderate. Knowledge from CPT lands mostly in the MLP. ---
  # Layers 0-2: the r64 update was concentrated (29-36 of 64 directions held 90 % of its energy, top-8
  # directions 50-72 %), so 32 is enough there.
  q_proj:
    - {layers: "0-2", r: 32}
    - {layers: "3-27", r: 64}
  # k/v: fewest directions used of all modules (~40/64 for 90 %) and only 1024 output rows (8 KV heads).
  # v_proj in 11-17 pushed against the SFT delta (z < -3 in L12, L16, L17): keep it small there.
  k_proj:
    - {layers: "0-2", r: 32}
    - {layers: "3-27", r: 48}
  v_proj:
    - {layers: "0-2", r: 32}
    - {layers: "3-10,18-27", r: 48}
    - {layers: "11-17", r: 32}
  # o_proj: flat spectrum in layers 3-27 (46-49 of 64 for 90 %) -> more rank, except the 11-17 band that
  # opposed SFT (o_proj L14 z = -3.3).
  o_proj:
    - {layers: "0-2", r: 32}
    - {layers: "3-10,18-27", r: 96}
    - {layers: "11-17", r: 64}

  # --- MLP: where the budget goes ---
  # gate_proj is the only module whose change grew with depth (2.0 % -> 3.2 %, peak 15-26), with a flat
  # spectrum: give the upper-middle stack the maximum rank.
  gate_proj:
    - {layers: "0-3", r: 96}
    - {layers: "4-7", r: 128}
    - {layers: "8-14", r: 192}
    - {layers: "15-26", r: 256}
    - {layers: "27", r: 128}
  # up_proj: flattest spectrum together with down_proj (45-48 of 64 for 90 %, top-8 only ~30 %).
  up_proj:
    - {layers: "0-7", r: 128}
    - {layers: "8-26", r: 192}
    - {layers: "27", r: 128}
  # down_proj: 46-50 of 64 for 90 % in layers 3-25 (most rank-hungry module). Layer 2 changed least and
  # layer 27 was the most concentrated matrix of the adapter (28 of 64 for 90 %, top-8 72 %).
  down_proj:
    - {layers: "0-2", r: 96}
    - {layers: "3-25", r: 192}
    - {layers: "26", r: 128}
    - {layers: "27", r: 32}
